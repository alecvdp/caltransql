services:
  postgres:
    image: postgres:16
    container_name: caltransql-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: caltransql
      POSTGRES_USER: caltrans
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schemas:/docker-entrypoint-initdb.d
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caltrans -d caltransql"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: caltransql-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@caltransql.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  nocodb:
    image: nocodb/nocodb:latest
    container_name: caltransql-nocodb
    restart: unless-stopped
    environment:
      NC_DB: "pg://postgres:5432?u=caltrans&p=${POSTGRES_PASSWORD:-changeme}&d=caltransql"
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data:
